# Checked once a week: the tabi submodule, and the actions used by the workflows.
version: 2
updates:
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "16:45"
      timezone: "Europe/Paris"
    commit-message:
      prefix: "⬆️ deps:"
    open-pull-requests-limit: 10

  # Also keeps SHA-pinned actions current, such as aws-actions/configure-aws-credentials.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "16:45"
      timezone: "Europe/Paris"
    commit-message:
      prefix: "⬆️ deps:"
    groups:
      github-actions:
        patterns: ["*"]
